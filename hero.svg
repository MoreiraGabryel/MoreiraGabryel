        </pattern>
        <radialGradient id="aura">
          <stop stop-color="var(--blue)" stop-opacity=".12"/>
          <stop offset="1" stop-color="var(--blue)" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="edge"><stop stop-color="var(--blue)"/>
          <stop offset=".7" stop-color="var(--blue)" stop-opacity=".15"/>
          <stop offset="1" stop-color="var(--yellow)"/></linearGradient>
      </defs>
      <style>
        svg {--bg:#0B1018;--panel:#101B2A;--ink:#F0F5FC;--muted:#A3B4CB;--line:#23374E;--blue:#53C7FF;--yellow:#F4D35E;--dim:#203C55;--grid:#142233} @media (prefers-color-scheme: light) { svg {--bg:#F3F7FC;--panel:#E6EFF9;--ink:#12243B;--muted:#4B617B;--line:#BDCEE1;--blue:#0969B5;--yellow:#8C6200;--dim:#B4CEE6;--grid:#E1EAF4} }
        text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; }
        .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; }
        .bg { fill: var(--bg); }
.panel { fill: var(--panel); }
.ink { fill: var(--ink); }
.muted { fill: var(--muted); }
.line { fill: var(--line); }
.blue { fill: var(--blue); }
.yellow { fill: var(--yellow); }
.dim { fill: var(--dim); }
.grid { fill: var(--grid); }
        .wire { fill: none; stroke: var(--line); stroke-width: 1.5; }
        .accent-wire { fill: none; stroke: var(--blue); stroke-width: 2; }
        .spark { fill: var(--yellow); }
        .monogram { fill: none; stroke: var(--blue); stroke-width: 5; stroke-linejoin: bevel; }
        .current { fill: none; stroke: var(--yellow); stroke-width: 5;
          stroke-dasharray: 24 476; stroke-linecap: round; }
        .signal { fill: none; stroke: var(--yellow); stroke-width: 2;
          stroke-dasharray: 18 482; }
        
      .orbit { animation: orbit 24s linear infinite; }
      .current { animation: flow 7s linear infinite; }
      .signal { animation: flow 12s linear infinite; }
      @keyframes orbit { to { transform: rotate(360deg); } }
      @keyframes flow { to { stroke-dashoffset: -500; } }
      @media (prefers-reduced-motion: reduce) {
        .orbit, .current, .signal { animation: none; }
      }
    
      </style>
