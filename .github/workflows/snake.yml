name: Electric Lab — Hero & Snake

on:
  schedule:
    - cron: "23 5,17 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/electric_lab.py"
      - "scripts/freeze_snake.py"
      - "tests/**"
      - ".github/workflows/snake.yml"

permissions:
  contents: write

concurrency:
  group: electric-lab-output
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate generator
        run: python -m unittest discover -s tests -v

      - name: Generate Electric Lab
        run: python scripts/electric_lab.py --output dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: MoreiraGabryel
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%238C6200&color_dots=%23E6EFF9,%23B4CEE6,%237BAED6,%233A8BC5,%230969B5
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%23F4D35E&color_dots=%23101B2A,%23203C55,%23296B96,%23399DD0,%2353C7FF

      - name: Generate reduced-motion snake images
        run: python scripts/freeze_snake.py dist

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
