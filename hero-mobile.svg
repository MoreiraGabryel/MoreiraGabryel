          <stop offset=".7" stop-color="var(--blue)" stop-opacity=".15"/>
          <stop offset="1" stop-color="var(--yellow)"/></linearGradient>
      </defs>
      <style>
        svg {--bg:#0B1018;--panel:#101B2A;--ink:#F0F5FC;--muted:#A3B4CB;--line:#23374E;--blue:#53C7FF;--yellow:#F4D35E;--dim:#203C55;--grid:#142233} @media (prefers-color-scheme: light) { svg {--bg:#F3F7FC;--panel:#E6EFF9;--ink:#12243B;--muted:#4B617B;--line:#BDCEE1;--blue:#0969B5;--yellow:#8C6200;--dim:#B4CEE6;--grid:#E1EAF4} }
        text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; }
        .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; }
        .bg { fill: var(--bg); }
.panel { fill: var(--panel); }
.ink { fill: var(--ink); }
