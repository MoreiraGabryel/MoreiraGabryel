.line { fill: var(--line); }
.blue { fill: var(--blue); }
.yellow { fill: var(--yellow); }
.dim { fill: var(--dim); }
.grid { fill: var(--grid); }
        .wire { fill: none; stroke: var(--line); stroke-width: 1.5; }
        .accent-wire { fill: none; stroke: var(--blue); stroke-width: 2; }
        .spark { fill: var(--yellow); }
        .monogram { fill: none; stroke: var(--blue); stroke-width: 5; stroke-linejoin: bevel; }
        .current { fill: none; stroke: var(--yellow); stroke-width: 5;
          stroke-dasharray: 24 476; stroke-linecap: round; }
        .signal { fill: none; stroke: var(--yellow); stroke-width: 2;
          stroke-dasharray: 18 482; }
        
      .orbit { animation: orbit 24s linear infinite; }
      .current { animation: flow 7s linear infinite; }
      .signal { animation: flow 12s linear infinite; }
      @keyframes orbit { to { transform: rotate(360deg); } }
      @keyframes flow { to { stroke-dashoffset: -500; } }
      @media (prefers-reduced-motion: reduce) {
        .orbit, .current, .signal { animation: none; }
      }
    
